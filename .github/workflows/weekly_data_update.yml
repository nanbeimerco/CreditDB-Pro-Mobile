name: Weekly Data Update

# AniList / Bangumi から週1回 DB を更新し、GitHub Release として配布する。
# DB は git にコミットしない（リポジトリ容量を増やさないため）。
# 入力: 最新の Release にある creditdb.zip / 出力: 新しい Release（creditdb.zip + version.json）

on:
  schedule:
    - cron: '0 0 * * 1' # 毎週月曜 00:00 UTC (日本時間 09:00)。GitHub 側の都合で数時間遅れることがある
  workflow_dispatch:
    inputs:
      recalc_only:
        description: 'API を呼ばずに再計算だけ行う'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: creditdb-data # AniList 一括取得と同時に動かない
  cancel-in-progress: false

env:
  KEEP_DATA_RELEASES: 8

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download previous database from the newest release
        id: prev
        run: |
          TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" \
            --jq '[.[] | select(.draft == false) | select(any(.assets[]; .name == "creditdb.zip"))][0].tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::creditdb.zip を含む Release が見つかりません"
            exit 1
          fi
          BODY=$(gh release view "$TAG" --json body -q .body)
          PREV_SHA=$(echo "$BODY" | grep -oE 'db-sha256: *[0-9a-f]{64}' | grep -oE '[0-9a-f]{64}' || true)
          mkdir -p work
          gh release download "$TAG" --pattern creditdb.zip --dir work
          if gh release view anilist-credits >/dev/null 2>&1; then
            gh release download anilist-credits --pattern anilist_credits.zip --dir work || true
          fi
          echo "Previous release: $TAG (db-sha256: ${PREV_SHA:-unknown})"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$PREV_SHA" >> "$GITHUB_OUTPUT"

      - name: Run weekly updater
        run: |
          ARGS="--input work/creditdb.zip --out-dir out --covers-seed app/src/main/assets/work_covers.json --anilist-out store/anilist_credits.zip"
          if [ -f work/anilist_credits.zip ]; then ARGS="$ARGS --anilist-store work/anilist_credits.zip"; fi
          if [ "${{ inputs.recalc_only }}" = "true" ]; then ARGS="$ARGS --recalc-only"; fi
          python tools/weekly_updater.py $ARGS

      - name: Check whether the database changed
        id: check
        run: |
          NEW_SHA=$(python -c "import json;print(json.load(open('out/version.json'))['sha256'])")
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          if [ "$NEW_SHA" = "${{ steps.prev.outputs.sha }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "DB に変更がないため Release を作成しません。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release metadata
        if: steps.check.outputs.changed == 'true'
        id: meta
        run: |
          echo "tag=data-$(date -u +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"
          echo "updated=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
          python - << 'EOF' >> "$GITHUB_OUTPUT"
          import json
          v = json.load(open("out/version.json"))
          print(f"works={v['totalWorks']}")
          print(f"staff={v['totalStaff']}")
          print(f"cv={v['totalCv']}")
          print(f"size_mb={v['dbSizeCompressed']/1048576:.1f}")
          EOF

      - name: Publish release
        if: steps.check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "CreditDB Data Release ${{ steps.meta.outputs.tag }}"
          body: |
            Automated weekly CreditDB database update (AniList & Bangumi API).
            - Updated at: ${{ steps.meta.outputs.updated }}
            - Works: ${{ steps.meta.outputs.works }} / Staff: ${{ steps.meta.outputs.staff }} / Cast: ${{ steps.meta.outputs.cv }}
            - File: `creditdb.zip` (${{ steps.meta.outputs.size_mb }} MB)
            - Based on: ${{ steps.prev.outputs.tag }}
            - db-sha256: ${{ steps.check.outputs.new_sha }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            out/creditdb.zip
            out/version.json

      - name: Upload AniList credit store
        if: hashFiles('store/anilist_credits.zip') != ''
        run: |
          if ! gh release view anilist-credits >/dev/null 2>&1; then
            gh release create anilist-credits --title "AniList credits store"               --notes "AniList の話数付きクレジットの保存先（ツール用。アプリは使わない）"               --prerelease --latest=false
          fi
          gh release upload anilist-credits store/anilist_credits.zip --clobber

      - name: Delete old data releases
        if: steps.check.outputs.changed == 'true'
        run: |
          # データ専用の Release（名前が "CreditDB Data Release" で、APK を含まないもの）だけを古い順に削除する
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '
            [.[] | select(.name // "" | startswith("CreditDB Data Release"))
                 | select(all(.assets[]; .name | test("^(creditdb\\.zip|creditdb\\.db|version\\.json)$")))]
            | sort_by(.created_at) | reverse | .[(env.KEEP_DATA_RELEASES | tonumber):] | .[].tag_name' |
          while read -r OLD; do
            echo "Deleting old data release: $OLD"
            gh release delete "$OLD" --yes --cleanup-tag
          done
